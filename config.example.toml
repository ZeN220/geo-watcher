[remnawave]
base_url = "https://your-remnawave-panel.com"
token = "your-api-token-here"

[telegram]
bot_token = "1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZ"
chat_id = 123456789
custom_emoji = true # Requires TG Premium from the bot creator
# message_thread_id = 42

[watcher]
interval = 3600
sources = ["services", "geoip", "stash"]  # Excluded CDN
state_file = "data/state.json"

# [watcher.excluded_checks]  # Checks to ignore (ID or name), by node name or glob
# "nl-*" = ["netflix_access"]
# "de-1" = ["Google", "YouTube*"]

[geocheck]
# interface = "eth0"  # Interface name or local IP on every node

# [geocheck.node_interfaces]  # Per-node overrides by node name or glob
# "nl-*" = "ens3"
# "nl-1" = "wg0"
# "de-1" = "203.0.113.7"  # Outgoing IP: must be assigned to an interface on the node
# "nl-2" = ""  # An empty string indicates the default route and ignores the global interface

[logging]
level = 20
format = "[%(levelname)s] %(asctime)s - %(name)s - %(message)s"
